# Spec Section 14 — Prometheus scrapes the Order Service's Actuator
# endpoint directly; no exporter needed since Micrometer's Prometheus
# registry already speaks the Prometheus exposition format.
global:
  scrape_interval: 5s # short interval so demo scenarios (Phase 4+) show up fast

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["localhost:8080"]
