[mypy]
# langchain_anthropic.ChatAnthropic and friends are pydantic models with
# aliased fields (e.g. `model` aliasing an internal name) -- without this
# plugin mypy doesn't understand pydantic's aliasing and wrongly flags
# ChatAnthropic(model=...) as an unexpected keyword argument.
plugins = pydantic.mypy

# graph/, nodes/, mcp_integrations/, and llm.py have no __init__.py --
# they're plain namespace packages that only resolve because ai-agent/
# is sys.path[0] when main.py (or any script here) is run directly. Mypy
# doesn't know that on its own, hence "Cannot find implementation or
# library stub for module named 'graph.routes'" etc. in the editor.
# mypy_path = . (this directory, ai-agent/) plus explicit_package_bases
# tells it the same thing Python's own import machinery already knows.
mypy_path = .
explicit_package_bases = True
namespace_packages = True

# Third-party stubs we don't ship/require (mcp, langgraph, langchain_*,
# etc.) -- don't fail the whole file over a missing stub package.
ignore_missing_imports = True
