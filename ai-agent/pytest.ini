# Test suite for the LangGraph incident-response agent. See
# tests/conftest.py for the fake-LLM fixture pattern and
# docs/learning-notes.md for the manual stubbing this formalizes.
[pytest]
# graph/, nodes/, mcp_integrations/ are namespace packages (no
# __init__.py) that only resolve when ai-agent/ is on sys.path -- see
# mypy.ini's comment for why. `pythonpath = .` gives pytest the same
# import root main.py gets for free by being run from this directory.
pythonpath = .
testpaths = tests
asyncio_mode = auto

markers =
    integration: needs live infra (scripts/start-infra.sh) -- run with `pytest -m integration`
    eval: calls a real LLM, costs tokens -- run with `pytest -m eval`

# Default run is the fast, mocked/deterministic suite only.
addopts = -m "not integration and not eval"
