spring.application.name=order-service
server.port=8080

# Actuator: expose health, prometheus scrape endpoint, and raw metrics.
# (Spec Section 6/13 — the AI agent must retrieve operational info through
# these endpoints, never by reading files directly.)
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always

# Tag every metric with the service name so PromQL/the observability MCP
# (Phase 3) can select "order-service" specifically once more services exist.
management.metrics.tags.application=${spring.application.name}

# Histogram buckets for http.server.requests -- without this, Prometheus
# has no way to compute latency percentiles (histogram_quantile) since
# only the sum/count are exported, not a distribution. The observability
# MCP server's get_latency_metrics() tool depends on this.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
